name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe/rev-list drive versionName/versionCode
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2
      - name: Build Rust native libs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/build-rust.sh "$PWD/app/src/main/jniLibs"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.CI_KEYSTORE_B64 }}" | base64 -d > /tmp/boxagent.keystore
          ls -l /tmp/boxagent.keystore
      - name: Assemble signed release APK
        env:
          CI_KEYSTORE: /tmp/boxagent.keystore
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease -PskipRustBuild=true --console=plain
      - name: Rename artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "BoxAgent-${{ github.ref_name }}.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "BoxAgent ${{ github.ref_name }}" \
            --prerelease \
            --generate-notes \
            "BoxAgent-${{ github.ref_name }}.apk"
